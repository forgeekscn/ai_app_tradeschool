  // 轮播图功能
  initCarousel();

  // 通知iframe调整大小
  ytSendPageSize();

  // 监听窗口大小变化
  window.addEventListener('resize', function () {
    ytSendPageSize();
  });
});

// 轮播图初始化
function initCarousel() {
  var carousel = document.getElementById('carousel');
  var indicators = document.querySelectorAll('.carousel-indicator');
  var prevBtn = document.getElementById('prevBtn');
  var nextBtn = document.getElementById('nextBtn');
  var currentIndex = 0;
  var totalSlides = indicators.length;

  // 设置轮播图位置
  function setCarouselPosition(index) {
    carousel.style.transform = &quot;translateX(-&quot;.concat(index * 100, &quot;%)&quot;);

    // 更新指示器状态
    indicators.forEach(function (indicator, i) {
      if (i === index) {
        indicator.classList.add('bg-white');
        indicator.classList.remove('bg-white/50');
      } else {
        indicator.classList.remove('bg-white');
        indicator.classList.add('bg-white/50');
      }
    });
    currentIndex = index;
  }

  // 下一张
  function nextSlide() {
    currentIndex = (currentIndex + 1) % totalSlides;
    setCarouselPosition(currentIndex);
  }

  // 上一张
  function prevSlide() {
    currentIndex = (currentIndex - 1 + totalSlides) % totalSlides;
    setCarouselPosition(currentIndex);
  }

  // 自动轮播
  var carouselInterval = setInterval(nextSlide, 5000);

  // 点击指示器切换
  indicators.forEach(function (indicator, index) {
    indicator.addEventListener('click', function () {
      clearInterval(carouselInterval);
      setCarouselPosition(index);
      carouselInterval = setInterval(nextSlide, 5000);
    });
  });

  // 前后按钮点击
  prevBtn.addEventListener('click', function () {
    clearInterval(carouselInterval);
    prevSlide();
    carouselInterval = setInterval(nextSlide, 5000);
  });
  nextBtn.addEventListener('click', function () {
    clearInterval(carouselInterval);
    nextSlide();
    carouselInterval = setInterval(nextSlide, 5000);
  });

  // 鼠标悬停暂停轮播
  carousel.parentElement.addEventListener('mouseenter', function () {
    clearInterval(carouselInterval);
  });

  // 鼠标离开继续轮播
  carousel.parentElement.addEventListener('mouseleave', function () {
    carouselInterval = setInterval(nextSlide, 5000);
  });
}

// 通知iframe调整大小
ytSendPageSize();</script>
